name: Set up bs-downloader
description: Install Rust and the native Linux musl compiler for the downloader.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.93.1
        components: rustfmt, clippy
    - name: Prepare static Linux target
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools cmake
        case "$(uname -m)" in
          x86_64) rustup target add x86_64-unknown-linux-musl ;;
          aarch64) rustup target add aarch64-unknown-linux-musl ;;
          *) exit 1 ;;
        esac
