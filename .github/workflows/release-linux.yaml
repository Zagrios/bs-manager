# This workflow will...

name: Release Linux

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

on:
    workflow_dispatch:

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest, ubuntu-24.04-arm]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: update apt-get
              run: sudo apt-get update

            - name: Install rpm/flatpak packages
              run: sudo apt-get install -y flatpak flatpak-builder rpm libarchive-tools

            - name: Setup flatpak repo
              run: |
                flatpak remote-add --if-not-exists --user \
                  flathub https://flathub.org/repo/flathub.flatpakrepo

            - name: Install pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
              with:
                  version: 10.34.4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      release/app/pnpm-lock.yaml
            # Native modules need lifecycle scripts, restricted by allowBuilds.
            - run: pnpm install --frozen-lockfile # NOSONAR
            - run: pnpm run build

            - name: Build deb
              if: matrix.os == 'ubuntu-latest'
              run: pnpm exec electron-builder --config electron-builder.config.js --publish always --linux deb --x64

            - name: Build rpm
              if: matrix.os == 'ubuntu-latest'
              run: pnpm exec electron-builder --config electron-builder.config.js --publish always --linux rpm --x64

            - name: Build flatpak
              run: env DEBUG="@malept/flatpak-bundler" pnpm exec electron-builder --config electron-builder.config.js --publish always --linux flatpak

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ matrix.os }}
                  path: release
